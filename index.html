<script type="text/babel" data-presets="react">
const { useState, useEffect, useMemo, useCallback } = React;

async function fbGet(path, fallback) {
  try {
    const res = await fetch(`${FIREBASE_URL}/${path}.json`);
    const data = await res.json();
    return data === null ? fallback : data;
  } catch {
    return fallback;
  }
}
async function fbSet(path, value) {
  try {
    const res = await fetch(`${FIREBASE_URL}/${path}.json`, {
      method: "PUT",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify(value),
    });
    if (!res.ok) return { ok: false, message: `HTTP ${res.status}` };
    return { ok: true };
  } catch (e) {
    return { ok: false, message: e?.message || String(e) };
  }
}

const uid = () => Math.random().toString(36).slice(2, 10);
const todayStr = () => new Date().toISOString().slice(0, 10);

function computeStandings(players, matches) {
  const stats = {};
  players.forEach((p) => {
    stats[p.id] = { id: p.id, name: p.name, played: 0, wins: 0, draws: 0, losses: 0, gf: 0, ga: 0, captainWins: 0, points: 0, form: [] };
  });
  const sorted = [...matches].sort((a, b) => a.date.localeCompare(b.date));
  sorted.forEach((m) => {
    const bibsWin = m.bibsScore > m.nonBibsScore;
    const nonBibsWin = m.nonBibsScore > m.bibsScore;
    const draw = m.bibsScore === m.nonBibsScore;
    const applyTeam = (ids, captainId, gf, ga, won) => {
      ids.forEach((pid) => {
        const s = stats[pid];
        if (!s) return;
        s.played += 1; s.gf += gf; s.ga += ga;
        let result = "D";
        if (draw) { s.draws += 1; s.points += 1; result = "D"; }
        else if (won) {
          s.wins += 1; s.points += 3; result = "W";
          if (pid === captainId) { s.captainWins += 1; s.points += 1; }
        } else { s.losses += 1; result = "L"; }
        s.form.push({ result, date: m.date, id: m.id });
      });
    };
    applyTeam(m.bibsPlayers, m.bibsCaptain, m.bibsScore, m.nonBibsScore, bibsWin);
    applyTeam(m.nonBibsPlayers, m.nonBibsCaptain, m.nonBibsScore, m.bibsScore, nonBibsWin);
  });
  return Object.values(stats)
    .map((s) => ({ ...s, gd: s.gf - s.ga, winRate: s.played > 0 ? Math.round((s.wins / s.played) * 100) : 0, form: s.form.slice(-5).reverse() }))
    .sort((a, b) => b.points - a.points || b.gd - a.gd || b.wins - a.wins || a.name.localeCompare(b.name));
}

function FormChip({ result }) {
  const map = { W: { bg: "#3E8E5B" }, D: { bg: "#8A8367" }, L: { bg: "#A6432F" } };
  return <span style={{ background: map[result].bg }} className="w-5 h-5 rounded-full flex items-center justify-center text-[10px] font-bold text-[#F3EFE3]">{result}</span>;
}

function RankBadge({ rank }) {
  const colors = ["#E8B94A", "#C9C9C9", "#B08655"];
  const bg = rank <= 3 ? colors[rank - 1] : "#243527";
  const fg = rank <= 3 ? "#16241C" : "#8FA391";
  return <div style={{ background: bg, color: fg }} className="w-7 h-7 rounded-full flex items-center justify-center font-mono text-xs font-bold shrink-0">{rank}
