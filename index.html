<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="theme-color" content="#16241C">

<title>Tuesday Night League</title>

<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Bebas+Neue&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@500;700&display=swap" rel="stylesheet">

<style>
* {
  box-sizing: border-box;
  -webkit-tap-highlight-color: transparent;
}

html, body {
  margin: 0;
  padding: 0;
  min-height: 100%;
  background: #16241C;
  color: #F3EFE3;
  font-family: 'Inter', sans-serif;
}

body {
  padding-bottom: 90px;
}

button,
input,
select {
  font-family: inherit;
}

button {
  cursor: pointer;
}

.font-display {
  font-family: 'Bebas Neue', sans-serif;
  letter-spacing: 0.02em;
}

.font-mono {
  font-family: 'JetBrains Mono', monospace;
}

#app {
  min-height: 100vh;
}

/* HEADER */

.header {
  position: relative;
  overflow: hidden;
  padding: 32px 20px 20px;
  background:
    radial-gradient(circle at 50% 120%, rgba(255,107,44,0.12), transparent 60%);
  border-bottom: 1px solid rgba(255,255,255,0.08);
}

.header-kicker {
  color: #FF6B2C;
  font-size: 12px;
  font-weight: 700;
  letter-spacing: 0.2em;
  text-transform: uppercase;
  margin-bottom: 4px;
}

.header h1 {
  margin: 0;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 42px;
  line-height: 0.95;
  font-weight: 400;
}

.header-meta {
  display: flex;
  gap: 12px;
  margin-top: 12px;
  color: #8FA391;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
}

/* MAIN */

.main {
  width: 100%;
  max-width: 520px;
  margin: 0 auto;
  padding: 16px;
}

.section {
  margin-bottom: 16px;
}

/* TABS */

.tab-bar {
  position: fixed;
  z-index: 100;
  bottom: 0;
  left: 0;
  right: 0;
  background: #1B2B1F;
  border-top: 1px solid rgba(255,255,255,0.08);
  padding-bottom: env(safe-area-inset-bottom);
}

.tab-inner {
  max-width: 520px;
  margin: 0 auto;
  display: flex;
}

.tab-button {
  flex: 1;
  border: 0;
  background: transparent;
  color: #8FA391;
  padding: 11px 4px 10px;
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
  letter-spacing: 0.05em;
}

.tab-button.active {
  color: #FF6B2C;
}

.tab-icon {
  display: block;
  font-size: 20px;
  margin-bottom: 3px;
}

/* CARDS */

.card {
  background: #1E3327;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 12px;
}

.card-padding {
  padding: 12px;
}

/* TABLE */

.table-header {
  display: flex;
  justify-content: space-between;
  padding: 0 8px;
  margin-bottom: 5px;
  color: #8FA391;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.15em;
}

.player-row {
  overflow: hidden;
  margin-bottom: 8px;
}

.player-main {
  width: 100%;
  border: 0;
  background: transparent;
  color: #F3EFE3;
  display: flex;
  align-items: center;
  gap: 12px;
  padding: 12px;
  text-align: left;
}

.rank {
  width: 28px;
  height: 28px;
  min-width: 28px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 12px;
  font-weight: 700;
}

.player-info {
  flex: 1;
  min-width: 0;
}

.player-name {
  font-size: 14px;
  font-weight: 600;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.captain-count {
  color: #E8B94A;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  margin-left: 5px;
}

.form {
  display: flex;
  gap: 4px;
  margin-top: 5px;
}

.form-chip {
  width: 20px;
  height: 20px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #F3EFE3;
  font-size: 10px;
  font-weight: 700;
}

.points {
  color: #FF6B2C;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 27px;
  line-height: 1;
}

.chevron {
  color: #8FA391;
  transition: transform 0.15s;
}

.chevron.open {
  transform: rotate(180deg);
}

.player-stats {
  display: grid;
  grid-template-columns: repeat(5, 1fr);
  gap: 4px;
  padding: 0 12px 12px;
}

.stat-cell {
  background: rgba(255,255,255,0.03);
  border-radius: 8px;
  padding: 8px 2px;
  text-align: center;
  font-family: 'JetBrains Mono', monospace;
  font-size: 11px;
}

.stat-label {
  color: #8FA391;
  font-size: 9px;
}

.stat-value {
  font-weight: 700;
  margin-top: 3px;
}

/* STATS */

.stats-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 8px;
}

.stat-card {
  padding: 12px;
}

.stat-icon {
  font-size: 18px;
}

.stat-card-label {
  color: #8FA391;
  font-family: 'JetBrains Mono', monospace;
  font-size: 9px;
  text-transform: uppercase;
  letter-spacing: 0.05em;
  margin-top: 8px;
}

.stat-card-name {
  font-size: 13px;
  font-weight: 600;
  margin-top: 2px;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.stat-card-value {
  font-family: 'Bebas Neue', sans-serif;
  font-size: 23px;
  margin-top: 2px;
}

.chart-title {
  color: #8FA391;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  margin-bottom: 12px;
}

.bar-row {
  display: flex;
  align-items: center;
  gap: 8px;
  margin-bottom: 8px;
  font-size: 11px;
}

.bar-name {
  width: 64px;
  color: #8FA391;
  white-space: nowrap;
  overflow: hidden;
  text-overflow: ellipsis;
}

.bar-background {
  flex: 1;
  height: 12px;
  border-radius: 10px;
  overflow: hidden;
  background: #16241C;
}

.bar {
  height: 100%;
  border-radius: 10px;
  background: #3E5A44;
}

.bar.first {
  background: #FF6B2C;
}

.bar-value {
  width: 25px;
  text-align: right;
  font-family: 'JetBrains Mono', monospace;
}

/* MANAGE */

.manage-tabs {
  display: flex;
  gap: 3px;
  background: #1B2B1F;
  padding: 4px;
  border-radius: 8px;
}

.manage-tab {
  flex: 1;
  border: 0;
  border-radius: 6px;
  background: transparent;
  color: #8FA391;
  padding: 9px 3px;
  font-size: 11px;
  font-weight: 600;
}

.manage-tab.active {
  background: #FF6B2C;
  color: #16241C;
}

.lock-button {
  width: 38px;
  height: 38px;
  margin-left: 8px;
  border: 0;
  border-radius: 8px;
  background: #1B2B1F;
  color: #8FA391;
}

/* FORM */

.field {
  margin-bottom: 16px;
}

.field-label {
  color: #8FA391;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
  text-transform: uppercase;
  letter-spacing: 0.15em;
  margin-bottom: 5px;
}

.input,
.select {
  width: 100%;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  background: #1E3327;
  color: #F3EFE3;
  padding: 10px 12px;
  font-size: 14px;
  outline: none;
}

.input:focus,
.select:focus {
  border-color: #FF6B2C;
}

input[type="date"] {
  color-scheme: dark;
}

input[type="number"] {
  text-align: center;
}

/* PLAYER ASSIGNMENT */

.player-buttons {
  display: flex;
  flex-wrap: wrap;
  gap: 6px;
  margin-top: 7px;
}

.player-button {
  border: 0;
  border-radius: 20px;
  padding: 7px 12px;
  font-size: 12px;
  font-weight: 600;
}

.player-button.none {
  background: #1E3327;
  color: #8FA391;
  border: 1px solid rgba(255,255,255,0.1);
}

.player-button.bibs {
  background: #FF6B2C;
  color: #16241C;
}

.player-button.nonbibs {
  background: #D8D3C4;
  color: #16241C;
}

/* TEAMS */

.team-grid {
  display: grid;
  grid-template-columns: 1fr 1fr;
  gap: 10px;
}

.team-panel {
  padding: 12px;
}

.team-title {
  display: flex;
  align-items: center;
  gap: 6px;
  font-size: 12px;
  font-weight: 700;
  text-transform: uppercase;
}

.team-dot {
  width: 8px;
  height: 8px;
  border-radius: 50%;
}

.team-count {
  margin-left: auto;
  color: #8FA391;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
}

.score-input {
  width: 100%;
  margin-top: 8px;
  border: 1px solid rgba(255,255,255,0.08);
  border-radius: 8px;
  background: #16241C;
  color: #F3EFE3;
  padding: 8px;
  font-family: 'JetBrains Mono', monospace;
  font-size: 18px;
  text-align: center;
  outline: none;
}

.captain-select {
  margin-top: 8px;
  font-size: 11px;
  padding: 8px;
}

/* BUTTONS */

.primary-button {
  width: 100%;
  border: 0;
  border-radius: 8px;
  background: #FF6B2C;
  color: #16241C;
  padding: 12px;
  font-size: 14px;
  font-weight: 700;
}

.secondary-button {
  border: 0;
  border-radius: 8px;
  background: #16241C;
  color: #8FA391;
  padding: 10px;
  font-size: 12px;
  font-weight: 700;
}

.small-button {
  border: 0;
  border-radius: 8px;
  background: #FF6B2C;
  color: #16241C;
  padding: 8px 13px;
  font-size: 14px;
  font-weight: 700;
}

/* PLAYER LIST */

.add-player {
  display: flex;
  gap: 8px;
  margin-bottom: 8px;
}

.add-player .input {
  flex: 1;
}

.player-list-item {
  display: flex;
  align-items: center;
  justify-content: space-between;
  background: #1E3327;
  border: 1px solid rgba(255,255,255,0.06);
  border-radius: 8px;
  padding: 9px 12px;
  margin-bottom: 6px;
  font-size: 13px;
  font-weight: 500;
}

.delete-button {
  border: 0;
  background: transparent;
  color: #8FA391;
  font-size: 16px;
}

/* HISTORY */

.history-card {
  padding: 12px;
  margin-bottom: 8px;
}

.history-top {
  display: flex;
  align-items: center;
  justify-content: space-between;
  margin-bottom: 8px;
}

.history-date {
  color: #8FA391;
  font-family: 'JetBrains Mono', monospace;
  font-size: 10px;
}

.history-delete {
  border: 0;
  background: transparent;
  color: #8FA391;
  font-size: 14px;
}

.history-teams {
  display: flex;
  align-items: center;
  gap: 8px;
}

.history-team {
  flex: 1;
  font-size: 11px;
  line-height: 1.5;
}

.history-team.right {
  text-align: right;
}

.history-team-name {
  font-size: 10px;
  font-weight: 700;
  text-transform: uppercase;
}

.history-team-name.bibs {
  color: #FF6B2C;
}

.history-team-name.nonbibs {
  color: #D8D3C4;
}

.history-score {
  padding: 0 5px;
  font-family: 'Bebas Neue', sans-serif;
  font-size: 21px;
}

/* PASSCODE */

.gate {
  text-align: center;
  padding: 40px 20px;
}

.gate-icon {
  width: 56px;
  height: 56px;
  margin: 0 auto 16px;
  border-radius: 50%;
  display: flex;
  align-items: center;
  justify-content: center;
  background: #1E3327;
  border: 1px solid rgba(255,255,255,0.08);
  font-size: 20px;
}

.gate h2 {
  margin: 0 0 5px;
  font-size: 17px;
}

.gate p {
  color: #8FA391;
  font-size: 12px;
  margin: 0 auto 20px;
  max-width: 300px;
}

.gate-form {
  max-width: 260px;
  margin: auto;
}

.gate-form .input {
  text-align: center;
  margin-bottom: 8px;
  letter-spacing: 0.2em;
}

/* EMPTY */

.empty {
  text-align: center;
  padding: 60px 15px;
  color: #8FA391;
  font-size: 13px;
}

.empty-icon {
  font-size: 25px;
  opacity: 0.5;
  margin-bottom: 12px;
}

/* ERRORS */

.error-box {
  margin-bottom: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  background: rgba(166,67,47,0.15);
  border: 1px solid #A6432F;
  color: #E8836A;
  font-size: 12px;
}

.success-box {
  margin-bottom: 12px;
  padding: 10px 12px;
  border-radius: 8px;
  background: rgba(62,142,91,0.15);
  border: 1px solid #3E8E5B;
  color: #8BD0A1;
  font-size: 12px;
}

.setup-screen {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  padding: 30px;
  text-align: center;
}

.loading {
  min-height: 100vh;
  display: flex;
  align-items: center;
  justify-content: center;
  color: #8FA391;
  font-family: 'JetBrains Mono', monospace;
  font-size: 13px;
}

/* MOBILE */

@media (max-width: 380px) {
  .header h1 {
    font-size: 37px;
  }

  .main {
    padding: 12px;
  }

  .team-grid {
    gap: 6px;
  }

  .team-panel {
    padding: 9px;
  }
}
</style>
</head>

<body>

<div id="app">
  <div class="loading">Loading league…</div>
</div>

<script>
/* ============================================================
   FIREBASE CONFIGURATION
   ============================================================ */

const FIREBASE_URL =
  "https://tuesday-night-football-e56de-default-rtdb.europe-west1.firebasedatabase.app";


/* ============================================================
   FIREBASE FUNCTIONS
   ============================================================ */

async function firebaseGet(path, fallback) {
  try {
    const response = await fetch(
      FIREBASE_URL + "/" + path + ".json"
    );

    if (!response.ok) {
      throw new Error("Firebase HTTP " + response.status);
    }

    const data = await response.json();

    if (data === null || data === undefined) {
      return fallback;
    }

    return data;

  } catch (error) {
    console.error("Firebase GET error:", error);
    throw error;
  }
}


async function firebaseSet(path, value) {
  try {
    const response = await fetch(
      FIREBASE_URL + "/" + path + ".json",
      {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(value)
      }
    );

    if (!response.ok) {
      throw new Error("Firebase HTTP " + response.status);
    }

    return true;

  } catch (error) {
    console.error("Firebase SET error:", error);
    throw error;
  }
}


/* ============================================================
   UTILITIES
   ============================================================ */

function uid() {
  return Math.random().toString(36).substring(2, 10);
}


function todayString() {
  const d = new Date();

  const year = d.getFullYear();
  const month = String(d.getMonth() + 1).padStart(2, "0");
  const day = String(d.getDate()).padStart(2, "0");

  return year + "-" + month + "-" + day;
}


function escapeHTML(value) {
  return String(value)
    .replace(/&/g, "&amp;")
    .replace(/</g, "&lt;")
    .replace(/>/g, "&gt;")
    .replace(/"/g, "&quot;")
    .replace(/'/g, "&#039;");
}


/* ============================================================
   APP STATE
   ============================================================ */

let players = [];
let matches = [];
let passcode = null;

let currentTab = "table";
let manageSection = "match";
let expandedPlayer = null;
let unlocked = false;


/* ============================================================
   STANDINGS
   ============================================================ */

function computeStandings() {

  const stats = {};

  players.forEach(function(player) {

    stats[player.id] = {
      id: player.id,
      name: player.name,
      played: 0,
      wins: 0,
      draws: 0,
      losses: 0,
      gf: 0,
      ga: 0,
      captainWins: 0,
      points: 0,
      form: []
    };

  });


  const sortedMatches = [...matches].sort(function(a, b) {
    return a.date.localeCompare(b.date);
  });


  sortedMatches.forEach(function(match) {

    const bibsWin =
      match.bibsScore > match.nonBibsScore;

    const nonBibsWin =
      match.nonBibsScore > match.bibsScore;

    const draw =
      match.bibsScore === match.nonBibsScore;


    function applyTeam(ids, captain, gf, ga, won) {

      ids.forEach(function(id) {

        const player = stats[id];

        if (!player) return;

        player.played++;
        player.gf += gf;
        player.ga += ga;

        let result = "D";

        if (draw) {

          player.draws++;
          player.points++;
          result = "D";

        } else if (won) {

          player.wins++;
          player.points += 3;
          result = "W";

          if (id === captain) {
            player.captainWins++;
            player.points++;
          }

        } else {

          player.losses++;
          result = "L";

        }

        player.form.push({
          result: result,
          date: match.date,
          id: match.id
        });

      });

    }


    applyTeam(
      match.bibsPlayers || [],
      match.bibsCaptain,
      Number(match.bibsScore),
      Number(match.nonBibsScore),
      bibsWin
    );


    applyTeam(
      match.nonBibsPlayers || [],
      match.nonBibsCaptain,
      Number(match.nonBibsScore),
      Number(match.bibsScore),
      nonBibsWin
    );

  });


  return Object.values(stats)
    .map(function(player) {

      return {
        ...player,

        gd: player.gf - player.ga,

        winRate:
          player.played > 0
            ? Math.round(
                (player.wins / player.played) * 100
              )
            : 0,

        form:
          player.form
            .slice(-5)
            .reverse()

      };

    })
    .sort(function(a, b) {

      return (
        b.points - a.points ||
        b.gd - a.gd ||
        b.wins - a.wins ||
        a.name.localeCompare(b.name)
      );

    });

}


/* ============================================================
   RENDER
   ============================================================ */

function render() {

  const app = document.getElementById("app");

  const standings = computeStandings();

  let html = "";

  html += renderHeader();

  html += '<main class="main">';

  if (currentTab === "table") {
    html += renderTable(standings);
  }

  if (currentTab === "stats") {
    html += renderStats(standings);
  }

  if (currentTab === "manage") {

    if (unlocked) {
      html += renderManage();
    } else {
      html += renderPasscodeGate();
    }

  }

  html += "</main>";

  html += renderTabBar();

  app.innerHTML = html;

  attachEvents();

}


/* ============================================================
   HEADER
   ============================================================ */

function renderHeader() {

  return `
    <header class="header">

      <div class="header-kicker">
        Bibs vs Non-Bibs
      </div>

      <h1>
        Tuesday Night League
      </h1>

      <div class="header-meta">

        <span>
          ${players.length} players
        </span>

        <span>·</span>

        <span>
          ${matches.length} games logged
        </span>

      </div>

    </header>
  `;

}


/* ============================================================
   TABLE
   ============================================================ */

function renderTable(standings) {

  if (standings.length === 0) {

    return `
      <div class="empty">
        <div class="empty-icon">🎽</div>
        Add players and log a match to see the table.
      </div>
    `;

  }


  let html = `

    <div class="table-header">
      <span>Player</span>
      <span>Pts</span>
    </div>

  `;


  standings.forEach(function(player, index) {

    const rank = index + 1;

    const isOpen =
      expandedPlayer === player.id;


    let rankBackground = "#243527";
    let rankColor = "#8FA391";

    if (rank === 1) {
      rankBackground = "#E8B94A";
      rankColor = "#16241C";
    }

    if (rank === 2) {
      rankBackground = "#C9C9C9";
      rankColor = "#16241C";
    }

    if (rank === 3) {
      rankBackground = "#B08655";
      rankColor = "#16241C";
    }


    let formHTML = "";

    if (player.form.length) {

      player.form.forEach(function(form) {

        let background = "#8A8367";

        if (form.result === "W") {
          background = "#3E8E5B";
        }

        if (form.result === "L") {
          background = "#A6432F";
        }

        formHTML += `
          <span
            class="form-chip"
            style="background:${background}"
          >
            ${form.result}
          </span>
        `;

      });

    } else {

      formHTML =
        '<span style="font-size:10px;color:#8FA391;font-family:JetBrains Mono">no games yet</span>';

    }


    html += `

      <div class="card player-row">

        <button
          class="player-main"
          data-action="expand"
          data-id="${player.id}"
        >

          <div
            class="rank"

/* ============================================================
   STATS
   ============================================================ */

function renderStats(standings) {

  const played =
    standings.filter(function(player) {
      return player.played > 0;
    });


  if (!played.length) {

    return `
      <div class="empty">
        <div class="empty-icon">🎽</div>
        Log a match to unlock stats.
      </div>
    `;

  }


  const topPoints =
    [...played].sort(
      (a, b) => b.points - a.points
    )[0];

  const topWinRate =
    [...played].sort(
      (a, b) =>
        b.winRate - a.winRate ||
        b.played - a.played
    )[0];

  const topCaptain =
    [...played].sort(
      (a, b) =>
        b.captainWins - a.captainWins
    )[0];

  const topGD =
    [...played].sort(
      (a, b) => b.gd - a.gd
    )[0];


  let html = '<div class="stats-grid">';


  html += statCard(
    "🏆",
    "Top of the table",
    topPoints.name,
    topPoints.points + " pts",
    "#E8B94A"
  );


  html += statCard(
    "📈",
    "Best win rate",
    topWinRate.name,
    topWinRate.winRate + "%",
    "#3E8E5B"
  );


  html += statCard(
    "👑",
    "Most captain wins",
    topCaptain.name,
    String(topCaptain.captainWins),
    "#FF6B2C"
  );


  html += statCard(
    "🎽",
    "Best goal diff",
    topGD.name,
    topGD.gd > 0
      ? "+" + topGD.gd
      : String(topGD.gd),
    "#8FA391"
  );


  html += "</div>";


  const top =
    standings.slice(0, 8);

  const maxPoints =
    Math.max(
      ...top.map(
        player => player.points
      ),
      1
    );


  html += `

    <div class="card card-padding" style="margin-top:16px">

      <div class="chart-title">
        Points leaders
      </div>

  `;


  top.forEach(function(player, index) {

    const width =
      (player.points / maxPoints) * 100;

    html += `

      <div class="bar-row">

        <div class="bar-name">
          ${escapeHTML(player.name)}
        </div>

        <div class="bar-background">

          <div
            class="bar ${index === 0 ? "first" : ""}"
            style="width:${width}%"
          ></div>

        </div>

        <div class="bar-value">
          ${player.points}
        </div>

      </div>

    `;

  });


  html += "</div>";

  return html;

}


function statCard(icon, label, name, value, color) {

  return `

    <div class="card stat-card">

      <div class="stat-icon">
        ${icon}
      </div>

      <div class="stat-card-label">
        ${label}
      </div>

      <div class="stat-card-name">
        ${escapeHTML(name)}
      </div>

      <div
        class="stat-card-value"
        style="color:${color}"
      >
        ${value}
      </div>

    </div>

  `;

}

/* ============================================================
   PASSCODE HANDLING
   ============================================================ */

async function handleUnlock() {

  const input =
    document.getElementById(
      "passcode-input"
    );

  const error =
    document.getElementById(
      "passcode-error"
    );


  const value =
    input ? input.value : "";


  if (!passcode) {

    const confirm =
      document.getElementById(
        "passcode-confirm"
      );


    if (!value || value.length < 4) {

      error.textContent =
        "Use at least 4 characters.";

      return;

    }


    if (
      !confirm ||
      value !== confirm.value
    ) {

      error.textContent =
        "Passcodes don't match.";

      return;

    }


    try {

      await firebaseSet(
        "passcode",
        value
      );

      passcode = value;

      unlocked = true;

      render();

    } catch (e) {

      error.textContent =
        "Couldn't save passcode: " +
        e.message;

    }

    return;

  }


  if (value === passcode) {

    unlocked = true;

    render();

  } else {

    error.textContent =
      "Wrong passcode.";

  }

}


/* ============================================================
   PLAYERS
   ============================================================ */

async function addNewPlayer() {

  const input =
    document.getElementById(
      "new-player"
    );


  if (!input) return;


  const name =
    input.value.trim();


  if (!name) return;


  const newPlayer = {
    id: uid(),
    name: name
  };


  try {

    players = [
      ...players,
      newPlayer
    ];

    await firebaseSet(
      "players",
      players
    );

    render();

  } catch (error) {

    alert(
      "Couldn't save player:\n" +
      error.message
    );

  }

}


async function deletePlayer(id) {

  const player =
    players.find(
      p => p.id === id
    );


  if (!player) return;


  if (
    !confirm(
      "Remove " +
      player.name +
      " from the player list?"
    )
  ) return;


  players =
    players.filter(
      p => p.id !== id
    );


  try {

    await firebaseSet(
      "players",
      players
    );

    render();

  } catch (error) {

    alert(
      "Couldn't save:\n" +
      error.message
    );

  }

}


/* ============================================================
   PLAYER ASSIGNMENT
   ============================================================ */

function assignPlayer(id) {

  const current =
    assignments[id];


  if (!current) {

    assignments[id] = "bibs";

  } else if (
    current === "bibs"
  ) {

    assignments[id] = "nonbibs";

  } else {

    delete assignments[id];

  }


  if (
    currentBibsCaptain &&
    assignments[currentBibsCaptain] !== "bibs"
  ) {
    currentBibsCaptain = "";
  }


  if (
    currentNonBibsCaptain &&
    assignments[currentNonBibsCaptain] !== "nonbibs"
  ) {
    currentNonBibsCaptain = "";
  }


  render();


  /* Restore button states */

  players.forEach(function(player) {

    const button =
      document.querySelector(
        `[data-action="assign-player"][data-id="${player.id}"]`
      );

    if (!button) return;


    const state =
      assignments[player.id];


    button.className =
      "player-button " +
      (state || "none");


  });

}


/* ============================================================
   SAVE MATCH
   ============================================================ */

async function saveMatchToFirebase() {

  const error =
    document.getElementById(
      "match-error"
    );


  const date =
    document.getElementById(
      "match-date"
    )?.value || todayString();


  const bibsIds =
    players
      .filter(
        player =>
          assignments[player.id] === "bibs"
      )
      .map(
        player => player.id
      );


  const nonBibsIds =
    players
      .filter(
        player =>
          assignments[player.id] === "nonbibs"
      )
      .map(
        player => player.id
      );


  if (!bibsIds.length ||
      !nonBibsIds.length) {

    error.textContent =
      "Assign at least one player to each side.";

    return;

  }


  const bibsScore =
    document.getElementById(
      "bibs-score"
    )?.value;


  const nonBibsScore =
    document.getElementById(
      "nonbibs-score"
    )?.value;


  if (
    bibsScore === "" ||
    nonBibsScore === ""
  ) {

    error.textContent =
      "Enter both scores.";

    return;

  }


  const match = {

    id: uid(),

    date: date,

    bibsPlayers: bibsIds,

    nonBibsPlayers: nonBibsIds,

    bibsCaptain:
      currentBibsCaptain || null,

    nonBibsCaptain:
      currentNonBibsCaptain || null,

    bibsScore:
      Number(bibsScore),

    nonBibsScore:
      Number(nonBibsScore)

  };


  try {

    matches = [
      ...matches,
      match
    ];


    await firebaseSet(
      "matches",
      matches
    );


    assignments = {};

    currentBibsCaptain = "";
    currentNonBibsCaptain = "";

    currentBibsScore = "";
    currentNonBibsScore = "";


    alert("Match saved!");

    render();

  } catch (e) {

    error.textContent =
      "Couldn't save match: " +
      e.message;

  }

}


/* ============================================================
   DELETE MATCH
   ============================================================ */

async function deleteMatch(id) {

  if (
    !confirm(
      "Delete this match?"
    )
  ) return;


  matches =
    matches.filter(
      match =>
        match.id !== id
    );


  try {

    await firebaseSet(
      "matches",
      matches
    );

    render();

  } catch (error) {

    alert(
      "Couldn't delete match:\n" +
      error.message
    );

  }

}


/* ============================================================
   CHANGE PASSCODE
   ============================================================ */

async function saveNewPasscode() {

  const current =
    document.getElementById(
      "current-passcode"
    )?.value || "";


  const next =
    document.getElementById(
      "new-passcode"
    )?.value || "";


  const error =
    document.getElementById(
      "change-passcode-error"
    );


  if (current !== passcode) {

    error.textContent =
      "Current passcode is wrong.";

    return;

  }


  if (next.length < 4) {

    error.textContent =
      "New passcode needs at least 4 characters.";

    return;

  }


  try {

    await firebaseSet(
      "passcode",
      next
    );

    passcode = next;

    changingPasscode = false;

    render();

  } catch (e) {

    error.textContent =
      "Couldn't save: " +
      e.message;

  }

}


/* ============================================================
   START APP
   ============================================================ */

async function startApp() {

  const app =
    document.getElementById(
      "app"
    );


  try {

    console.log(
      "TNF: starting application"
    );


    if (
      !FIREBASE_URL ||
      FIREBASE_URL.includes("PASTE")
    ) {

      throw new Error(
        "Firebase URL is not configured."
      );

    }


    const results =
      await Promise.all([

        firebaseGet(
          "players",
          []
        ),

        firebaseGet(
          "matches",
          []
        ),

        firebaseGet(
          "passcode",
          null
        )

      ]);


    players =
      Array.isArray(results[0])
        ? results[0]
        : [];


    matches =
      Array.isArray(results[1])
        ? results[1]
        : [];


    passcode =
      results[2] || null;


    console.log(
      "TNF: Firebase loaded",
      {
        players: players.length,
        matches: matches.length,
        hasPasscode: !!passcode
      }
    );


    render();


  } catch (error) {

    console.error(
      "TNF startup error:",
      error
    );


    app.innerHTML = `

      <div class="setup-screen">

        <div style="max-width:420px">

          <div
            style="
              font-size:32px;
              margin-bottom:15px
            "
          >
            ⚠️
          </div>

          <h2
            style="
              margin:0 0 10px;
              color:#FF6B2C
            "
          >
            Dashboard couldn't load
          </h2>

          <p
            style="
              color:#8FA391;
              font-size:13px;
              line-height:1.6
            "
          >
            The dashboard loaded, but it
            couldn't connect to Firebase.
          </p>

          <div
            style="
              margin-top:15px;
              padding:12px;
              background:#1E3327;
              border:1px solid rgba(255,255,255,0.08);
              border-radius:8px;
              text-align:left;
              font-family:monospace;
              font-size:11px;
              color:#E8836A;
              word-break:break-word
            "
          >
            ${escapeHTML(error.message)}
          </div>

          <p
            style="
              margin-top:15px;
              color:#8FA391;
              font-size:11px
            "
          >
            Open Safari's developer console if
            you need more information.
          </p>

        </div>

      </div>

    `;

  }

}


startApp();

</script>
