/* =========================
   FIREBASE
========================= */

async function fbGet(path, fallback) {
  try {
    const controller = new AbortController();

    const timeout = setTimeout(() => {
      controller.abort();
    }, 8000);

    const response = await fetch(
      FIREBASE_URL + "/" + path + ".json",
      { signal: controller.signal }
    );

    clearTimeout(timeout);

    if (!response.ok) {
      throw new Error("Firebase HTTP " + response.status);
    }

    const data = await response.json();

    return data === null ? fallback : data;

  } catch (error) {
    console.error("Firebase GET error:", error);
    return fallback;
  }
}


async function fbSet(path, value) {
  try {
    const response = await fetch(
      FIREBASE_URL + "/" + path + ".json",
      {
        method: "PUT",
        headers: {
          "Content-Type": "application/json"
        },
        body: JSON.stringify(value)
      }
    );

    if (!response.ok) {
      return {
        ok:false,
        message:"Firebase HTTP " + response.status
      };
    }

    return { ok:true };

  } catch (error) {
    console.error("Firebase SET error:", error);

    return {
      ok:false,
      message:error.message || String(error)
    };
  }
}

/* =========================
   STANDINGS
========================= */

function computeStandings(players, matches) {

  const stats = {};

  players.forEach((player) => {

    stats[player.id] = {
      id:player.id,
      name:player.name,
      played:0,
      wins:0,
      draws:0,
      losses:0,
      gf:0,
      ga:0,
      captainWins:0,
      points:0,
      form:[]
    };

  });


  const sortedMatches = [...matches].sort(
    (a,b) => a.date.localeCompare(b.date)
  );


  sortedMatches.forEach((match) => {

    const bibsWin =
      match.bibsScore > match.nonBibsScore;

    const nonBibsWin =
      match.nonBibsScore > match.bibsScore;

    const draw =
      match.bibsScore === match.nonBibsScore;


    const applyTeam = (
      ids,
      captainId,
      gf,
      ga,
      won
    ) => {

      ids.forEach((playerId) => {

        const stat = stats[playerId];

        if (!stat) return;

        stat.played += 1;
        stat.gf += gf;
        stat.ga += ga;

        let result = "D";

        if (draw) {

          stat.draws += 1;
          stat.points += 1;
          result = "D";

        } else if (won) {

          stat.wins += 1;
          stat.points += 3;
          result = "W";

          if (playerId === captainId) {
            stat.captainWins += 1;
            stat.points += 1;
          }

        } else {

          stat.losses += 1;
          result = "L";

        }

        stat.form.push({
          result,
          date:match.date,
          id:match.id
        });

      });

    };


    applyTeam(
      match.bibsPlayers || [],
      match.bibsCaptain,
      match.bibsScore,
      match.nonBibsScore,
      bibsWin
    );


    applyTeam(
      match.nonBibsPlayers || [],
      match.nonBibsCaptain,
      match.nonBibsScore,
      match.bibsScore,
      nonBibsWin
    );

  });


  return Object.values(stats)
    .map((stat) => ({
      ...stat,
      gd:stat.gf - stat.ga,
      winRate:
        stat.played > 0
          ? Math.round((stat.wins / stat.played) * 100)
          : 0,
      form:stat.form.slice(-5).reverse()
    }))
    .sort(
      (a,b) =>
        b.points - a.points ||
        b.gd - a.gd ||
        b.wins - a.wins ||
        a.name.localeCompare(b.name)
    );
}


/* =========================

  return (

}


/* =========================
   APP
========================= */

function App() {

  const [players,setPlayers] = useState([]);
  const [matches,setMatches] = useState([]);
  const [passcode,setPasscode] = useState(null);

  const [unlocked,setUnlocked] = useState(false);
  const [loading,setLoading] = useState(true);
  const [tab,setTab] = useState("table");
  const [expandedRow,setExpandedRow] = useState(null);
  const [saveError,setSaveError] = useState(null);


  useEffect(() => {

    async function load() {

      setLoading(true);

      const results = await Promise.all([
        fbGet("players",[]),
        fbGet("matches",[]),
        fbGet("passcode",null)
      ]);

      setPlayers(
        Array.isArray(results[0])
          ? results[0]
          : []
      );

      setMatches(
        Array.isArray(results[1])
          ? results[1]
          : []
      );

      setPasscode(results[2] || null);

      setLoading(false);
    }

    load();

  }, []);


  const persistPlayers = useCallback(
    async (next) => {

      setPlayers(next);

      const result =
        await fbSet("players",next);

      setSaveError(
        result.ok
          ? null
          : result.message
      );

    },
    []
  );


  const persistMatches = useCallback(
    async (next) => {

      setMatches(next);

      const result =
        await fbSet("matches",next);

      setSaveError(
        result.ok
          ? null
          : result.message
      );

    },
    []
  );


  const persistPasscode = useCallback(
    async (next) => {

      setPasscode(next);

      const result =
        await fbSet("passcode",next);

      setSaveError(
        result.ok
          ? null
          : result.message
      );

    },
    []
  );


  const standings = useMemo(
    () =>
      computeStandings(
        players,
        matches
      ),
    [players,matches]
  );


  const stats = useMemo(() => {

    const played =
      standings.filter(
        s => s.played > 0
      );

    if (!played.length) return null;

    return {

      topPoints:
        [...played].sort(
          (a,b) => b.points-a.points
        )[0],

      topWinRate:
        [...played].sort(
          (a,b) =>
            b.winRate-a.winRate ||
            b.played-a.played
        )[0],

      topCaptain:
        [...played].sort(
          (a,b) =>
            b.captainWins-a.captainWins
        )[0],

      topGd:
        [...played].sort(
          (a,b) => b.gd-a.gd
        )[0]

    };

  },[standings]);


  if (loading) {

    return (
      <div className="min-h-screen flex items-center justify-center bg-[#16241C]">

        <div className="text-[#8FA391] font-mono text-sm">
          Loading league…
        </div>

      </div>
    );

  }


  return (

    <div
      className="min-h-screen pb-24"
      style={{
        background:"#16241C",
        backgroundImage:
          "repeating-linear-gradient(to bottom, rgba(255,255,255,0.015) 0px, rgba(255,255,255,0.015) 40px, transparent 40px, transparent 80px)"
      }}
    >

      <Header
        playedCount={matches.length}
        playerCount={players.length}
      />


      {saveError && (

        <div className="max-w-md mx-auto px-4 mt-3">

          <div
            className="rounded-lg px-3 py-2 text-xs font-medium"
            style={{
              background:"rgba(166,67,47,0.15)",
              border:"1px solid #A6432F",
              color:"#E8836A"
            }}
          >

            That last change didn't save.

            <div className="mt-1 font-mono opacity-80">
              {saveError}
            </div>

          </div>

        </div>

      )}


      <main className="max-w-md mx-auto px-4 mt-4">

        {tab === "table" && (

          <TableTab
            standings={standings}
            expandedRow={expandedRow}
            setExpandedRow={setExpandedRow}
          />

        )}


        {tab === "stats" && (

          <StatsTab
            standings={standings}
            stats={stats}
          />

        )}


        {tab === "manage" && (

          unlocked ?

          <ManageTab
            players={players}
            matches={matches}
            persistPlayers={persistPlayers}
            persistMatches={persistMatches}
            passcode={passcode}
            persistPasscode={persistPasscode}
            onLock={() => setUnlocked(false)}
          />

          :

          <PasscodeGate
            passcode={passcode}
            persistPasscode={persistPasscode}
            onUnlock={() => setUnlocked(true)}
          />

        )}

      </main>


      <TabBar
        tab={tab}
        setTab={setTab}
      />

    </div>

  );
}

/* =========================
   PASSCODE
========================= */

function PasscodeGate({
  passcode,
  persistPasscode,
  onUnlock
}) {

  const isSetup = !passcode;

  const [value,setValue] = useState("");
  const [confirmValue,setConfirmValue] = useState("");
  const [error,setError] = useState("");


  const submit = async () => {

    setError("");

    if (isSetup) {

      if (value.length < 4) {
        setError("Use at least 4 characters.");
        return;
      }

      if (value !== confirmValue) {
        setError("Passcodes don't match.");
        return;
      }

      await persistPasscode(value);
      onUnlock();

    } else {

      if (value === passcode) {
        onUnlock();
      } else {
        setError("Wrong passcode.");
      }

    }

  };


  return (

    <div className="py-10 text-center">

      <div
        className="w-14 h-14 rounded-full flex items-center justify-center mx-auto mb-4 text-xl"
        style={{
          background:"#1E3327",
          border:
            "1px solid rgba(255,255,255,0.08)"
        }}
      >
        {isSetup ? "🔑" : "🔒"}
      </div>


      <h2 className="font-semibold mb-1">
        {isSetup
          ? "Set a manager passcode"
          : "Manager access"}
      </h2>


      <p className="text-xs text-[#8FA391] mb-5 px-6">

        {isSetup
          ? "Anyone with this passcode can add players, log matches, and edit history."
          : "Enter the passcode to add matches or edit players."}

      </p>


      <div className="max-w-[240px] mx-auto space-y-2">

        <input
          type="password"
          autoFocus
          value={value}
          onChange={e => setValue(e.target.value)}
          onKeyDown={e =>
            e.key === "Enter" &&
            !isSetup &&
            submit()
          }
          placeholder="Passcode"
          className="w-full rounded-lg px-3 py-2.5 text-sm text-center outline-none tracking-widest"
          style={{
            background:"#1E3327",
            border:
              "1px solid rgba(255,255,255,0.1)",
            color:"#F3EFE3"
          }}
        />


        {isSetup && (

          <input
            type="password"
            value={confirmValue}
            onChange={e =>
              setConfirmValue(e.target.value)
            }
            onKeyDown={e =>
              e.key === "Enter" &&
              submit()
            }
            placeholder="Confirm passcode"
            className="w-full rounded-lg px-3 py-2.5 text-sm text-center outline-none tracking-widest"
            style={{
              background:"#1E3327",
              border:
                "1px solid rgba(255,255,255,0.1)",
              color:"#F3EFE3"
            }}
          />

        )}


        {error && (

          <p className="text-[#E8836A] text-xs">
            {error}
          </p>

        )}


        <button
          onClick={submit}
          className="w-full rounded-lg py-2.5 text-sm font-bold mt-1"
          style={{
            background:"#FF6B2C",
            color:"#16241C"
          }}
        >
          {isSetup
            ? "Set passcode & unlock"
            : "Unlock"}
        </button>

      </div>

    </div>

  );

}

   MANAGE
========================= */

  persistPlayers,

  passcode,
  persistPasscode,
  onLock

  const [section,setSection] =

    useState(false);


  return (

      <div className="flex items-center justify-between">

        <div
          className="flex gap-1 rounded-lg p-1 flex-1"
          style={{background:"#1B2B1F"}}
        >

          {[
            {

              label:"Log match"
            },
            {
              id:"players",
              label:"Players"
            },
            {
              id:"history",

            }
          ].map(s => (

            <button
              key={s.id}
              onClick={() => setSection(s.id)}
              className="flex-1 text-xs font-semibold py-2 rounded-md"
              style={{
                background:
                  section === s.id
                    ? "#FF6B2C"
                    : "transparent",
                color:
                  section === s.id
                    ? "#16241C"
                    : "#8FA391"
              }}
            >
              {s.label}
            </button>

          ))}

        </div>


        <button
          onClick={onLock}
          className="ml-2 w-9 h-9 rounded-lg flex items-center justify-center shrink-0"
          style={{
            background:"#1B2B1F",
            color:"#8FA391"
          }}
        >
          🔒
        </button>

      </div>


      {section === "players" && (

        <>
          <PlayersSection
            players={players}
            persistPlayers={persistPlayers}
          />

          <ChangePasscode
            passcode={passcode}
            persistPasscode={persistPasscode}
            changing={changingCode}
            setChanging={setChangingCode}
          />
        </>

      )}


      {section === "match" && (

        <LogMatchSection
          players={players}
          matches={matches}
          persistMatches={persistMatches}
        />

      )}


      {section === "history" && (

        <HistorySection
          players={players}
          matches={matches}
          persistMatches={persistMatches}
        />

      )}

    </div>

  );

}


/* =========================
   CHANGE PASSCODE
========================= */

function ChangePasscode({
  passcode,
  persistPasscode,
  changing,
  setChanging
}) {

  const [current,setCurrent] = useState("");
  const [next,setNext] = useState("");
  const [error,setError] = useState("");


  const submit = async () => {

    setError("");

    if (current !== passcode) {
      setError("Current passcode is wrong.");
      return;
    }

    if (next.length < 4) {
      setError(
        "New passcode needs at least 4 characters."
      );
      return;
    }

    await persistPasscode(next);

    setCurrent("");
    setNext("");
    setChanging(false);

  };


  if (!changing) {

    return (

      <button
        onClick={() => setChanging(true)}
        className="text-[10px] text-[#8FA391] font-mono underline pt-1"
      >
        Change manager passcode
      </button>

    );

  }


  return (

    <div
      style={{
        background:"#1E3327",
        border:
          "1px solid rgba(255,255,255,0.06)"
      }}
      className="rounded-xl p-3 space-y-2"
    >

      <p className="text-[10px] uppercase tracking-widest text-[#8FA391] font-mono">
        Change passcode
      </p>


      <input
        type="password"
        placeholder="Current passcode"
        value={current}
        onChange={e =>
          setCurrent(e.target.value)
        }
        className="w-full rounded-lg px-3 py-2 text-sm outline-none"
        style={{
          background:"#16241C",
          border:
            "1px solid rgba(255,255,255,0.08)",
          color:"#F3EFE3"
        }}
      />


      <input
        type="password"
        placeholder="New passcode"
        value={next}
        onChange={e =>
          setNext(e.target.value)
        }
        className="w-full rounded-lg px-3 py-2 text-sm outline-none"
        style={{
          background:"#16241C",
          border:
            "1px solid rgba(255,255,255,0.08)",
          color:"#F3EFE3"
        }}
      />


      {error && (

        <p className="text-[#E8836A] text-xs">
          {error}
        </p>

      )}


      <div className="flex gap-2">

        <button
          onClick={submit}
          className="flex-1 rounded-lg py-2 text-xs font-bold"
          style={{
            background:"#FF6B2C",
            color:"#16241C"
          }}
        >
          Save
        </button>


        <button
          onClick={() => {
            setChanging(false);
            setError("");
          }}
          className="flex-1 rounded-lg py-2 text-xs font-bold"
          style={{
            background:"#16241C",
            color:"#8FA391"
          }}
        >
          Cancel
        </button>

      </div>

    </div>

  );

}


/* =========================
   PLAYERS
========================= */

function PlayersSection({
  players,
  persistPlayers
}) {

  const [name,setName] = useState("");


  const add = async () => {

    const trimmed = name.trim();

    if (!trimmed) return;

    await persistPlayers([
      ...players,
      {
        id:uid(),
        name:trimmed
      }
    ]);

    setName("");

  };


  const remove = async (id) => {

    await persistPlayers(
      players.filter(
        p => p.id !== id
      )
    );

  };


  return (

    <div className="space-y-2">

      <div className="flex gap-2">

        <input
          value={name}
          onChange={e =>
            setName(e.target.value)
          }
          onKeyDown={e =>
            e.key === "Enter" &&
            add()
          }
          placeholder="Add a player"
          className="flex-1 rounded-lg px-3 py-2 text-sm outline-none"
          style={{
            background:"#1E3327",
            border:
              "1px solid rgba(255,255,255,0.08)",
            color:"#F3EFE3"
          }}
        />


        <button
          onClick={add}
          className="rounded-lg px-3 flex items-center justify-center font-bold"
          style={{
            background:"#FF6B2C",
            color:"#16241C"
          }}
        >
          +
        </button>

      </div>


      <div className="space-y-1.5">

        {!players.length && (

          <EmptyState
            text="No players yet — add your first one above."
          />

        )}


        {players.map(player => (

          <div
            key={player.id}
            className="flex items-center justify-between rounded-lg px-3 py-2"
            style={{
              background:"#1E3327",
              border:
                "1px solid rgba(255,255,255,0.06)"
            }}
          >

            <span className="text-sm font-medium">
              {player.name}
            </span>

            <button
              onClick={() =>
                remove(player.id)
              }
              className="text-[#8FA391]"
            >
              🗑
            </button>

          </div>

        ))}

      </div>

    </div>

  );

}


/* =========================
   LOG MATCH
========================= */

function LogMatchSection({
  players,
  matches,
  persistMatches
}) {

  const [date,setDate] =
    useState(todayStr());

  const [assign,setAssign] =
    useState({});

  const [bibsCaptain,setBibsCaptain] =
    useState("");

  const [nonBibsCaptain,setNonBibsCaptain] =
    useState("");

  const [bibsScore,setBibsScore] =
    useState("");

  const [nonBibsScore,setNonBibsScore] =
    useState("");

  const [error,setError] =
    useState("");


  const cycle = (id) => {

    setAssign(previous => {

      const current =
        previous[id];

      const next =
        current === undefined
          ? "bibs"
          : current === "bibs"
          ? "nonbibs"
          : undefined;

      const copy = {
        ...previous
      };

      if (next === undefined) {
        delete copy[id];
      } else {
        copy[id] = next;
      }

      return copy;

    });

  };


  const bibsIds =
    players
      .filter(
        p => assign[p.id] === "bibs"
      )
      .map(p => p.id);


  const nonBibsIds =
    players
      .filter(
        p => assign[p.id] === "nonbibs"
      )
      .map(p => p.id);


  useEffect(() => {

    if (!bibsIds.includes(bibsCaptain)) {
      setBibsCaptain("");
    }

    if (!nonBibsIds.includes(nonBibsCaptain)) {
      setNonBibsCaptain("");
    }

  },[assign]);


  const submit = async () => {

    setError("");

    if (
      bibsIds.length === 0 ||
      nonBibsIds.length === 0
    ) {

      setError(
        "Assign at least one player to each side."
      );

      return;
    }


    if (
      bibsScore === "" ||
      nonBibsScore === ""
    ) {

      setError(
        "Enter both scores."
      );

      return;
    }


    const match = {

      id:uid(),

      date,

      bibsPlayers:bibsIds,

      nonBibsPlayers:nonBibsIds,

      bibsCaptain:
        bibsCaptain || null,

      nonBibsCaptain:
        nonBibsCaptain || null,

      bibsScore:Number(bibsScore),

      nonBibsScore:Number(nonBibsScore)

    };


    await persistMatches([
      ...matches,
      match
    ]);


    setAssign({});
    setBibsCaptain("");
    setNonBibsCaptain("");
    setBibsScore("");
    setNonBibsScore("");

  };


  if (!players.length) {

    return (
      <EmptyState
        text="Add players first, then come back to log a match."
      />
    );

  }


  return (

    <div className="space-y-4">

      <div>

        <FieldLabel>
          Date
        </FieldLabel>

        <input
          type="date"
          value={date}
          onChange={e =>
            setDate(e.target.value)
          }
          className="w-full rounded-lg px-3 py-2 text-sm outline-none font-mono"
          style={{
            background:"#1E3327",
            border:
              "1px solid rgba(255,255,255,0.08)",
            color:"#F3EFE3"
          }}
        />

      </div>


      <div>

        <FieldLabel>
          Tap a player to assign — Bibs, then Non-bibs
        </FieldLabel>


        <div className="flex flex-wrap gap-1.5 mt-1.5">

          {players.map(player => {

            const state =
              assign[player.id];


            const style =
              state === "bibs"

                ? {
                    background:"#FF6B2C",
                    color:"#16241C"
                  }

                : state === "nonbibs"

                ? {
                    background:"#D8D3C4",
                    color:"#16241C"
                  }

                : {
                    background:"#1E3327",
                    color:"#8FA391",
                    border:
                      "1px solid rgba(255,255,255,0.1)"
                  };


            return (

              <button
                key={player.id}
                onClick={() =>
                  cycle(player.id)
                }
                className="px-3 py-1.5 rounded-full text-xs font-semibold"
                style={style}
              >
                {player.name}
              </button>

            );

          })}

        </div>

      </div>


      <div className="grid grid-cols-2 gap-3">

        <TeamPanel
          label="Bibs"
          color="#FF6B2C"
          ids={bibsIds}
          players={players}
          captain={bibsCaptain}
          setCaptain={setBibsCaptain}
          score={bibsScore}
          setScore={setBibsScore}
        />


        <TeamPanel
          label="Non-bibs"
          color="#D8D3C4"
          ids={nonBibsIds}
          players={players}
          captain={nonBibsCaptain}
          setCaptain={setNonBibsCaptain}
          score={nonBibsScore}
          setScore={setNonBibsScore}
        />

      </div>


      {error && (

        <p className="text-[#E8836A] text-xs font-medium">
          {error}
        </p>

      )}


      <button
        onClick={submit}
        className="w-full rounded-lg py-3 text-sm font-bold"
        style={{
          background:"#FF6B2C",
          color:"#16241C"
        }}
      >
        + Save match
      </button>

    </div>

  );

}


/* =========================
   TEAM PANEL
========================= */

function TeamPanel({
  label,
  color,
  ids,
  players,
  captain,
  setCaptain,
  score,
  setScore
}) {

  const names =
    players.filter(
      p => ids.includes(p.id)
    );


  return (

    <div
      style={{
        background:"#1E3327",
        border:
          "1px solid rgba(255,255,255,0.06)"
      }}
      className="rounded-xl p-3 space-y-2"
    >

      <div className="flex items-center gap-1.5">

        <span
          className="w-2 h-2 rounded-full"
          style={{background:color}}
        />

        <span className="text-xs font-bold uppercase tracking-wide">
          {label}
        </span>

        <span className="text-[10px] text-[#8FA391] font-mono ml-auto">
          {ids.length}
        </span>

      </div>


      <input
        type="number"
        inputMode="numeric"
        min="0"
        placeholder="Score"
        value={score}
        onChange={e =>
          setScore(e.target.value)
        }
        className="w-full rounded-lg px-2 py-2 text-center text-lg font-mono outline-none"
        style={{
          background:"#16241C",
          border:
            "1px solid rgba(255,255,255,0.08)",
          color:"#F3EFE3"
        }}
      />


      <select
        value={captain}
        onChange={e =>
          setCaptain(e.target.value)
        }
        disabled={!names.length}
        className="w-full rounded-lg px-2 py-2 text-xs outline-none"
        style={{
          background:"#16241C",
          border:
            "1px solid rgba(255,255,255,0.08)",
          color:"#F3EFE3"
        }}
      >

        <option value="">
          Captain…
        </option>

        {names.map(player => (

          <option
            key={player.id}
            value={player.id}
          >
            {player.name}
          </option>

        ))}

      </select>

    </div>

  );

}


function FieldLabel({children}) {

  return (

    <p className="text-[10px] uppercase tracking-widest text-[#8FA391] font-mono mb-1">
      {children}
    </p>

  );

}


/* =========================
   HISTORY
========================= */

function HistorySection({
  players,
  matches,
  persistMatches
}) {

  const nameOf = (id) =>
    players.find(
      p => p.id === id
    )?.name || "?";


  const sorted =
    [...matches].sort(
      (a,b) =>
        b.date.localeCompare(a.date)
    );


  const remove = async (id) => {

    await persistMatches(
      matches.filter(
        m => m.id !== id
      )
    );

  };


  if (!sorted.length) {

    return (
      <EmptyState
        text="No matches logged yet."
      />
    );

  }


  return (

    <div className="space-y-2">

      {sorted.map(match => (

        <div
          key={match.id}
          style={{
            background:"#1E3327",
            border:
              "1px solid rgba(255,255,255,0.06)"
          }}
          className="rounded-xl p-3"
        >

          <div className="flex items-center justify-between mb-2">

            <span className="text-[10px] font-mono text-[#8FA391]">
              📅 {match.date}
            </span>

            <button
              onClick={() =>
                remove(match.id)
              }
              className="text-[#8FA391]"
            >
              ✕
            </button>

          </div>


          <div className="flex items-center justify-between text-sm">

            <div className="flex-1">

              <p className="text-[#FF6B2C] text-[10px] font-bold uppercase">
                Bibs
              </p>

              <p className="text-xs leading-relaxed">

                {(match.bibsPlayers || [])
                  .map(id =>
                    id === match.bibsCaptain
                      ? "👑" + nameOf(id)
                      : nameOf(id)
                  )
                  .join(", ")}

              </p>

            </div>


            <div className="px-3 font-bold text-lg font-display">

              {match.bibsScore}
              –
              {match.nonBibsScore}

            </div>


            <div className="flex-1 text-right">

              <p className="text-[#D8D3C4] text-[10px] font-bold uppercase">
                Non-bibs
              </p>

              <p className="text-xs leading-relaxed">

                {(match.nonBibsPlayers || [])
                  .map(id =>
                    id === match.nonBibsCaptain
                      ? "👑" + nameOf(id)
                      : nameOf(id)
                  )
                  .join(", ")}

              </p>

            </div>

          </div>

        </div>

      ))}

    </div>

  );

}


/* =========================
   START APP
========================= */

try {

  const root =
    ReactDOM.createRoot(
      document.getElementById("root")
    );

  root.render(<App />);

} catch (error) {

  console.error(error);

  document.getElementById("root").innerHTML =

    '<div style="padding:30px;color:#F3EFE3;background:#16241C;font-family:Arial">' +

    '<h2>Dashboard error</h2>' +

    '<p>' +
    String(error.message || error) +
    '</p>' +

    '</div>';

}
